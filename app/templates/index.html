<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espaco Girassol | Terapias Integrativas</title>
    <meta name="description" content="Espaco Girassol: terapias integrativas com acolhimento, clareza e cuidado humano.">

    <link rel="preload" href="{{ url_for('static', filename='fonts/CormorantGaramond-VariableFont_wght.ttf') }}" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="{{ url_for('static', filename='fonts/SourceSans3-VariableFont_wght.ttf') }}" as="font" type="font/ttf" crossorigin>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/header.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo_logo.png') }}">
</head>
<body class="bg-stone-50 text-stone-900">
    <header class="sg-header sticky top-0 z-50 border-b border-stone-200/80 bg-white/90 backdrop-blur-sm">
        <div class="relative flex w-full items-center justify-between py-3 pl-4 pr-4 sm:pl-6 sm:pr-6 lg:pl-8 lg:pr-8">
            <a href="#inicio" class="sg-brand-lock" aria-label="Ir para o inicio">
                <img
                    src="{{ url_for('static', filename='images/logo_logo.png') }}"
                    alt="Logo do Espaco Girassol"
                    class="sg-logo object-cover"
                >
                <div class="sg-brand-content">
                    <p class="sg-brand leading-none">Espaço Girassol</p>
                    <p class="sg-kicker text-stone-600">Terapias integrativas</p>
                </div>
            </a>

            <button
                id="menu-toggle"
                type="button"
                class="absolute right-4 top-4 inline-flex items-center justify-center rounded-lg border border-stone-300 bg-white p-2 text-stone-700 hover:border-amber-400 hover:text-amber-700 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-500 md:hidden"
                aria-controls="menu-principal"
                aria-expanded="false"
                aria-label="Abrir menu principal"
            >
                <svg id="menu-icon-open" class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
                <svg id="menu-icon-close" class="hidden h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 6l12 12M18 6L6 18" />
                </svg>
            </button>

            <nav id="menu-principal" class="sg-nav-shell absolute left-1/2 top-[calc(100%+0.75rem)] z-50 hidden w-[min(90vw,22rem)] -translate-x-1/2 md:static md:block md:w-auto md:max-w-none md:-translate-x-0" aria-label="Menu principal">
                <ul class="flex flex-col items-center gap-1.5 text-center rounded-xl border border-amber-100 bg-white px-3 py-2.5 shadow-lg md:flex-row md:items-center md:justify-center md:gap-6 md:border-none md:bg-transparent md:p-0 md:shadow-none">
                    <li><a href="#inicio" class="sg-nav-link">Início</a></li>
                    <li><a href="#sobre" class="sg-nav-link">Sobre</a></li>
                    <li><a href="#servicos" class="sg-nav-link">Serviços</a></li>
                    <li>
                        <a href="#contacto" class="sg-cta inline-flex items-center justify-center rounded-full bg-amber-500 px-4 py-2 text-sm font-semibold text-white transition hover:bg-amber-600 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-500">
                            Falar Connosco
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section id="inicio" class="mx-auto max-w-6xl px-4 py-16 sm:px-6 lg:px-8">
            <h1 class="sg-hero-title text-4xl text-stone-900 sm:text-5xl">Cuidar de si pode comecar com um pequeno passo.</h1>
            <p class="sg-hero-lead mt-4 text-stone-700">
                Estrutura inicial pronta. No proximo passo, desenvolvemos o hero completo e as secoes da landing page.
            </p>
        </section>
        <section id="sobre" class="h-1"></section>
        <section id="servicos" class="h-1"></section>
        <section id="contacto" class="h-1"></section>
    </main>

    <script src="{{ url_for('static', filename='js/header.js') }}" defer></script>
</body>
</html>
